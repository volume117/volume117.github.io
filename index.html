<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mike's Homepage</title>
<meta name="description" content="Mike's: about and links.">
<meta name="theme-color" content="#0c110d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c110d'/%3E%3Cpath d='M3 4l4 4-4 4' stroke='%23b6f2a4' stroke-width='2' fill='none'/%3E%3Crect x='8' y='11' width='5' height='2' fill='%23ffcc33'/%3E%3C/svg%3E">
<style>
:root{--bg:#07090b;--win:#0c110d;--fg:#b6f2a4;--hot:#ffcc33;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:12vh 16px 2rem;min-height:100vh;color:var(--fg);font:15px/1.55 var(--mono);background-color:var(--bg);
  background-image:radial-gradient(1px 1px at 12px 18px,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 61px 77px,#9cf9 50%,transparent 51%),radial-gradient(1.5px 1.5px at 97px 31px,#ffd9 50%,transparent 51%),radial-gradient(1px 1px at 140px 120px,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 33px 140px,#f8f7 50%,transparent 51%);
  background-size:160px 160px}
:focus-visible{outline:2px dashed var(--hot);outline-offset:3px}
::selection{background:var(--fg);color:var(--win)}
.win{max-width:34rem;margin-inline:auto;background:var(--win);border:2px solid var(--fg);box-shadow:6px 6px 0 #000,0 0 40px #b6f2a41a;position:relative}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,#0003 2px 3px)}
.bar{display:flex;justify-content:space-between;gap:1rem;background:var(--fg);color:var(--win);font-weight:700;padding:.2rem .6rem}
main{padding:1.4rem 1.1rem 1.5rem}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 .8rem;color:var(--hot);text-shadow:3px 3px 0 #a03fa0}
.cursor{display:inline-block;width:.55em;height:.9em;background:var(--hot);margin-left:.15em;vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
p{margin:0 0 1.4rem;max-width:62ch}
.buttons{display:flex;flex-wrap:wrap;gap:.5rem;margin:0;padding:0;list-style:none}
.b88{display:grid;place-items:center;width:88px;height:31px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-decoration:none;color:#fff;border:2px outset #ccc}
.b88:hover{border-style:inset;filter:brightness(1.2)}
.ig{background:linear-gradient(45deg,#f9a12e,#e1306c 55%,#833ab4)}
.li{background:#0a66c2}
.mail{background:#2a6e2a}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</head>
<body>
<div class="win">
  <div class="bar"><span>MIKE.EXE</span><span aria-hidden="true">_ □ ×</span></div>
  <main>
    <h1>Ayooo, I'm Mike<span class="cursor" aria-hidden="true"></span></h1>
    <p>CyberSec Professional & Photographer. Coffee Nerd, GeoGuessr extraordinaire.  If in Olympia, WA Reach out</p>
    <ul class="buttons">
      <li><a class="b88 ig" href="https://www.instagram.com/burncamino/" rel="me noopener" target="_blank">INSTAGRAM</a></li>
      <li><a class="b88 li" href="https://www.linkedin.com/in/mburtrum" rel="me noopener" target="_blank">LINKEDIN</a></li>
      <li><a class="b88 mail" href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#109;&#116;&#46;&#98;&#117;&#114;&#116;&#114;&#117;&#109;&#64;&#103;&#109;&#97;&#105;&#108;&#46;&#99;&#111;&#109;">E-MAIL ME</a></li>
    </ul>
    <p id="note" role="status"></p>
  </main>
</div>
<script>
document.querySelector(".mail").addEventListener("click", function () {
  var a = this.href.replace("mailto:", ""), n = document.getElementById("note");
  function done(t) { n.textContent = t; }
  if (navigator.clipboard) navigator.clipboard.writeText(a).then(function () {
    done("Email address copied. Paste it into your mail app if one didn't open.");
  }, function () { done("If no mail app opened, message me on LinkedIn or Instagram. :)"); });
});
</script>
</body>
</html>
